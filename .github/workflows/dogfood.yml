name: verit-dogfood

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "owner/repo#number (default solana-foundation/pay#415)"
        required: false
        default: "solana-foundation/pay#415"
  pull_request:

# checks:write posts the behavior-proof Check Run. On a fork PR the token stays
# read-only and the post degrades to a dry run, by design, never a failure.
permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The dogfood run consumes the published composite action from this same
      # checkout, so every PR proves action.yml still works instead of drifting
      # from a duplicated copy of the pipeline.
      #
      # prove runs the repo's own `pnpm test` inside this runner, which is the
      # sandbox for v1, so it reviews *this* PR, not an unrelated repo, and
      # the ProveRunner refuses anything whose checkout is not the target.
      - name: Dogfood pipeline (ingest-pr → review → prove → post check)
        uses: ./
        with:
          # Empty on a pull_request: the action defaults to the triggering PR.
          pr: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.pr || 'solana-foundation/pay#415') || '' }}
          prove-timeout-ms: "900000"
          # The lane harness stays on the stub unless BOTH the variable and the
          # key are set, so a fork PR (no secrets) or a half-configured repo
          # falls back instead of burning the job timeout on a CLI that cannot
          # authenticate. Set the variable to claude and add the secret to flip.
          lane-harness: ${{ vars.VERIT_LANE_HARNESS }}
          lane-model: ${{ vars.VERIT_LANE_MODEL }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Both must be set for the run to be uploaded. With either unset the
          # pipeline behaves exactly as it did before the dashboard existed:
          # no upload, no proof page link, same Check.
          dashboard-url: ${{ vars.VERIT_DASHBOARD_URL }}
          ingest-token: ${{ secrets.VERIT_INGEST_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: verit-proof
          path: .data/proofs/
          if-no-files-found: warn
