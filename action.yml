name: "verit behavior proof"
description: "Run the pull request's own tests and post the pass/fail result as a GitHub Check, with a structured Understanding."
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  pr:
    description: "owner/repo#number to review. Defaults to the pull request that triggered this run."
    required: false
    default: ""
  github-token:
    description: "Token used to read the PR and post the Check. Needs checks:write to post. Without it the Check is printed, not posted."
    required: false
    default: ${{ github.token }}
  prove-command:
    description: "Override the detected verification command, as argv, e.g. 'pnpm test'. Detected from the repo when empty."
    required: false
    default: ""
  prove-timeout-ms:
    description: "Hard timeout for the verification command. The process group is killed."
    required: false
    default: "600000"
  lane-harness:
    description: "Headless coding CLI that writes the Understanding: claude or cursor. Empty uses the deterministic stub."
    required: false
    default: ""
  lane-model:
    description: "Model passed to the selected lane harness."
    required: false
    default: ""
  anthropic-api-key:
    description: "Auth for lane-harness: claude. Leave empty and the lane falls back to the stub."
    required: false
    default: ""
  dashboard-url:
    description: "Base URL of a verit dashboard. Set with ingest-token to upload the run and link its proof page."
    required: false
    default: ""
  ingest-token:
    description: "Per-repo ingest token issued by the dashboard. Set with dashboard-url."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # verit runs from its own checkout, which is github.action_path. The repo
    # under review stays in GITHUB_WORKSPACE, which is where prove executes.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    # pnpm/action-setup cannot be used here. It resolves package_json_file
    # against the caller's GITHUB_WORKSPACE, which never contains verit's
    # checkout, and passing `version` instead makes it fail on any caller whose
    # own package.json pins a different pnpm. Install from verit's own pin.
    - name: Install pnpm
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install -g "$(node -p "require('./package.json').packageManager")"
    - name: Install verit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile
    - name: Install Claude Code
      if: inputs.lane-harness == 'claude' && inputs.anthropic-api-key != ''
      shell: bash
      run: npm install -g @anthropic-ai/claude-code
    - name: Review, prove and post the Check
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PR_SPEC: ${{ inputs.pr != '' && inputs.pr || format('{0}#{1}', github.repository, github.event.pull_request.number) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # On a pull_request event GITHUB_SHA is the throwaway merge commit, and a
        # Check posted there never surfaces on the pull request. Pin the Check to
        # the head commit. Empty off a pull request, which falls back to
        # GITHUB_SHA.
        VERIT_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        # prove runs in the caller's checkout, and the ProveRunner refuses any
        # checkout that is not the repo under review.
        VERIT_PROVE_CWD: ${{ github.workspace }}
        VERIT_PROVE_CMD: ${{ inputs.prove-command }}
        VERIT_PROVE_TIMEOUT_MS: ${{ inputs.prove-timeout-ms }}
        VERIT_SQLITE_PATH: ${{ github.action_path }}/.data/verit.db
        # The lane stays on the stub unless both the harness and its key are set,
        # so a fork PR with no secrets degrades instead of hanging on a CLI that
        # cannot authenticate.
        VERIT_LANE_HARNESS: ${{ inputs.anthropic-api-key != '' && inputs.lane-harness || '' }}
        VERIT_LANE_MODEL: ${{ inputs.lane-model }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        VERIT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        VERIT_INGEST_TOKEN: ${{ inputs.ingest-token }}
      run: pnpm exec tsx packages/cli/src/main.ts dogfood "$PR_SPEC"
