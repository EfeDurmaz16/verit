name: "verit behavior proof"
description: "Run the pull request's own tests and post the pass/fail result as a GitHub Check, with a structured Understanding."
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  pr:
    description: "owner/repo#number to review. Defaults to the pull request that triggered this run."
    required: false
    default: ""
  github-token:
    description: "Token used to read the PR and post the Check. Needs checks:write to post. Without it the Check is printed, not posted."
    required: false
    default: ${{ github.token }}
  prove-command:
    description: "Override the detected verification command, as argv, e.g. 'pnpm test'. Detected from the repo when empty."
    required: false
    default: ""
  prove-timeout-ms:
    description: "Hard timeout for the verification command. The process group is killed."
    required: false
    default: "600000"
  install-command:
    description: "Install the reviewed repo's own dependencies before prove, in GITHUB_WORKSPACE, e.g. 'pnpm install --frozen-lockfile' or 'npm ci'. Empty means verit installs nothing for you: a repo whose tests need node_modules must install them in an earlier workflow step, or prove cannot run its command."
    required: false
    default: ""
  corpus-opt-out:
    description: "Set to 1 to keep this repository's runs out of verit's shared execution memory. Public repositories are included by default, private ones never are unless corpus-opt-in is set."
    required: false
    default: ""
  corpus-opt-in:
    description: "Set to 1 to let a private repository's normalized run metadata join verit's execution memory. No code, logs or artifacts are ever stored."
    required: false
    default: ""
  job-spec-secret:
    description: "Secret the planning side signs the execution job spec with. Without it a run is signed locally and its spec is not portable."
    required: false
    default: ""
  fail-on:
    description: "failure or never. Default never keeps neutral neutral. failure gates the Check: an inconclusive proof (nothing ran, refused, no command found, or partial coverage) fails instead of passing, since a required check counts neutral as a pass."
    required: false
    default: "never"
  lane-provider:
    description: "Model API behind the analysis lane: anthropic or openai-compat. Empty disables the lane and the Check is neutral."
    required: false
    default: ""
  lane-tier:
    description: "Review quality tier: fast, balanced, or max. Empty means balanced. fast is a single judge call; balanced and max add a cheap triage map pass first. The tier maps to models in the README matrix, all swappable."
    required: false
    default: ""
  lane-mode:
    description: "What the lane produces: understanding, review, or both. Empty means both. understanding summarizes only. review and both also hunt located findings, then a skeptic pass refutes each one and drops the ones it cannot confirm. Findings are advisory, they never change the Check conclusion."
    required: false
    default: ""
  lane-model:
    description: "Optional judge override, e.g. anthropic/claude-opus-5. Set it to pin one exact model regardless of tier. Empty lets the tier pick the judge."
    required: false
    default: ""
  lane-api-key:
    description: "API key for lane-provider. Falls back to an ANTHROPIC_API_KEY or OPENAI_API_KEY env on the step."
    required: false
    default: ""
  lane-base-url:
    description: "Base URL for lane-provider: openai-compat. Covers OpenAI, Grok, DeepSeek, GLM, local vLLM."
    required: false
    default: ""
  lane-harness:
    description: "Legacy: headless coding CLI (claude or cursor) instead of the built-in lane. Used only when lane-provider is empty."
    required: false
    default: ""
  anthropic-api-key:
    description: "Legacy: auth for lane-harness: claude. Empty disables that harness."
    required: false
    default: ""
  dashboard-url:
    description: "Base URL of a verit dashboard. Set with ingest-token to upload the run and link its proof page."
    required: false
    default: ""
  ingest-token:
    description: "Per-repo ingest token issued by the dashboard. Set with dashboard-url."
    required: false
    default: ""

runs:
  using: composite
  steps:
    # THE FIRST THING THAT RUNS. Nothing above it, on purpose.
    #
    # Under pull_request_target, workflow_run or issue_comment the job holds a
    # write-scoped token and the repository's secrets, and GITHUB_WORKSPACE may
    # hold the pull request's own code. Installing that repository's
    # dependencies is already running its code: a postinstall script is a shell
    # script the author chose. So the decision is made here, before any step
    # touches the workspace, and every step that could execute repository code
    # is gated on this output.
    #
    # https://securitylab.github.com/resources/github-actions-preventing-pwn-requests/
    - name: Decide whether this event may run repository code
      id: gate
      shell: bash
      run: |
        case "${GITHUB_EVENT_NAME:-}" in
          pull_request_target|workflow_run|issue_comment)
            echo "safe=false" >> "$GITHUB_OUTPUT"
            {
              echo "reason<<VERIT_EOF"
              echo "verit declined to run under ${GITHUB_EVENT_NAME}. That event carries a write-scoped token and the repository's secrets, and running the reviewed code beside them is not a trade worth taking. Trigger verit with \"on: pull_request\" instead."
              echo "VERIT_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "verit: declining ${GITHUB_EVENT_NAME}, no reviewed code will run"
            ;;
          *)
            echo "safe=true" >> "$GITHUB_OUTPUT"
            echo "reason=" >> "$GITHUB_OUTPUT"
            ;;
        esac
    # verit runs from its own checkout, which is github.action_path. The repo
    # under review stays in GITHUB_WORKSPACE, which is where prove executes.
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    # pnpm/action-setup cannot be used here. It resolves package_json_file
    # against the caller's GITHUB_WORKSPACE, which never contains verit's
    # checkout, and passing `version` instead makes it fail on any caller whose
    # own package.json pins a different pnpm. Install from verit's own pin.
    - name: Install pnpm
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm install -g "$(node -p "require('./package.json').packageManager")"
    - name: Install verit
      shell: bash
      working-directory: ${{ github.action_path }}
      run: pnpm install --frozen-lockfile
    - name: Install Claude Code
      if: steps.gate.outputs.safe == 'true' && inputs.lane-harness == 'claude' && inputs.anthropic-api-key != ''
      shell: bash
      run: npm install -g @anthropic-ai/claude-code
    # Install the reviewed repo's OWN dependencies, in the caller's checkout, so
    # a healthy JS PR whose tests need node_modules reaches a real prove run
    # instead of a false failure. The steps above install verit in
    # github.action_path; this one installs the caller's deps in
    # github.workspace, the same directory prove runs in (VERIT_PROVE_CWD).
    # Passed through env, never inlined into the script, so a workflow input
    # cannot inject shell. Empty input skips this: the caller installs its own.
    - name: Install the reviewed repo's dependencies
      if: steps.gate.outputs.safe == 'true' && inputs.install-command != ''
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        INSTALL_COMMAND: ${{ inputs.install-command }}
      run: |
        echo "verit: installing reviewed repo dependencies in $PWD"
        echo "verit: $INSTALL_COMMAND"
        $INSTALL_COMMAND
    - name: Review, prove and post the Check
      id: review
      if: steps.gate.outputs.safe == 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PR_SPEC: ${{ inputs.pr != '' && inputs.pr || format('{0}#{1}', github.repository, github.event.pull_request.number) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        # On a pull_request event GITHUB_SHA is the throwaway merge commit, and a
        # Check posted there never surfaces on the pull request. Pin the Check to
        # the head commit. Empty off a pull request, which falls back to
        # GITHUB_SHA.
        VERIT_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        # prove runs in the caller's checkout, and the ProveRunner refuses any
        # checkout that is not the repo under review.
        VERIT_PROVE_CWD: ${{ github.workspace }}
        # The base commit of the pull request. The differential review compares
        # against it; without one there is nothing to compare and the review
        # reports only what the proof said.
        VERIT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Consent for the shared execution memory, decided before anything is
        # recorded. Private repositories are out unless corpus-opt-in says so.
        VERIT_REPO_VISIBILITY: ${{ github.event.repository.private && 'private' || 'public' }}
        VERIT_CORPUS_OPT_OUT: ${{ inputs.corpus-opt-out }}
        VERIT_CORPUS_OPT_IN: ${{ inputs.corpus-opt-in }}
        VERIT_JOB_SPEC_SECRET: ${{ inputs.job-spec-secret }}
        VERIT_PROVE_CMD: ${{ inputs.prove-command }}
        VERIT_PROVE_TIMEOUT_MS: ${{ inputs.prove-timeout-ms }}
        VERIT_FAIL_ON: ${{ inputs.fail-on }}
        VERIT_SQLITE_PATH: ${{ github.action_path }}/.data/verit.db
        # Lane inputs pass through IN_* names so a VERIT_LANE_* env set on the
        # caller's step is not clobbered by this env block. The run step below
        # resolves each one: a non-empty input wins, else the caller's env.
        IN_LANE_PROVIDER: ${{ inputs.lane-provider }}
        IN_LANE_TIER: ${{ inputs.lane-tier }}
        IN_LANE_MODE: ${{ inputs.lane-mode }}
        IN_LANE_MODEL: ${{ inputs.lane-model }}
        IN_LANE_API_KEY: ${{ inputs.lane-api-key }}
        IN_LANE_BASE_URL: ${{ inputs.lane-base-url }}
        # Legacy CLI harness path. Active only when both the harness and its key
        # are set, so a fork PR with no secrets degrades instead of hanging on a
        # CLI that cannot authenticate.
        VERIT_LANE_HARNESS: ${{ inputs.anthropic-api-key != '' && inputs.lane-harness || '' }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        VERIT_DASHBOARD_URL: ${{ inputs.dashboard-url }}
        VERIT_INGEST_TOKEN: ${{ inputs.ingest-token }}
      run: |
        export VERIT_LANE_PROVIDER="${IN_LANE_PROVIDER:-${VERIT_LANE_PROVIDER:-}}"
        export VERIT_LANE_TIER="${IN_LANE_TIER:-${VERIT_LANE_TIER:-}}"
        export VERIT_LANE_MODE="${IN_LANE_MODE:-${VERIT_LANE_MODE:-}}"
        export VERIT_LANE_MODEL="${IN_LANE_MODEL:-${VERIT_LANE_MODEL:-}}"
        export VERIT_LANE_API_KEY="${IN_LANE_API_KEY:-${VERIT_LANE_API_KEY:-}}"
        export VERIT_LANE_BASE_URL="${IN_LANE_BASE_URL:-${VERIT_LANE_BASE_URL:-}}"
        # A provider with no reachable key cannot authenticate. A fork PR gets
        # no secrets, so disable the lane and let the Check go neutral instead
        # of burning the job timeout.
        if [ -n "$VERIT_LANE_PROVIDER" ] && [ -z "$VERIT_LANE_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
          echo "lane: provider set but no API key is available, lane disabled, the Check will be neutral"
          export VERIT_LANE_PROVIDER=""
        fi
        # Drop persist-credentials extraheader from the prove checkout.
        # Lane bash can read VERIT_PROVE_CWD from /proc/<ppid>/environ and
        # git config that path. Hiding the path is not enough.
        strip_git_credentials() {
          local dir="$1"
          [ -n "$dir" ] || return 0
          [ -e "$dir/.git" ] || return 0
          # grep exits 1 on no match. pipefail would fail the step. Keep going.
          local keys
          keys="$(git -C "$dir" config --local --name-only --list 2>/dev/null \
            | grep -E '(^http\.extraheader$|\.extraheader$|^credential\.helper$|^credential\..*\.helper$)' || true)"
          [ -n "$keys" ] || return 0
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            git -C "$dir" config --local --unset-all "$key" || true
          done <<< "$keys"
        }
        strip_git_credentials "${VERIT_PROVE_CWD:-}"
        strip_git_credentials "${GITHUB_WORKSPACE:-}"
        # Persist tokens off this process, then replace the shell. Lane bash
        # is the same user and can read /proc/<ppid>/environ; the lane host
        # must not have these keys at exec time.
        umask 077
        export VERIT_TOKEN_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/verit-tok.XXXXXX")"
        printf '%s' "${GITHUB_TOKEN:-}" > "$VERIT_TOKEN_DIR/github"
        printf '%s' "${VERIT_INGEST_TOKEN:-}" > "$VERIT_TOKEN_DIR/ingest"
        unset GITHUB_TOKEN VERIT_INGEST_TOKEN
        exec pnpm exec tsx packages/cli/src/main.ts dogfood "$PR_SPEC"

    # The declined path. Trusted code only: this runs in github.action_path,
    # reads no reviewed checkout, installs nothing belonging to the repository
    # under review, and runs no command that repository defined. If it cannot
    # publish the neutral Check it exits non-zero, because a workflow that looks
    # like it ran verit and did not is worse than one that visibly stopped.
    - name: Publish the refusal
      if: steps.gate.outputs.safe != 'true'
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PR_SPEC: ${{ inputs.pr != '' && inputs.pr || format('{0}#{1}', github.repository, github.event.pull_request.number) }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        VERIT_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        VERIT_REFUSAL_REASON: ${{ steps.gate.outputs.reason }}
      run: pnpm exec tsx packages/cli/src/main.ts refuse "$PR_SPEC"


# Declared after runs: on purpose. The review step writes these to
# $GITHUB_OUTPUT (see writeActionOutputs in packages/cli/src/main.ts), so a
# caller can gate later steps on the Check without re-parsing verit's stdout.
outputs:
  conclusion:
    description: "The Check conclusion for this run: success, failure, or neutral."
    value: ${{ steps.review.outputs.conclusion }}
  run-id:
    description: "The verit run id, the key for this run's proof artifacts and dashboard page."
    value: ${{ steps.review.outputs.run-id }}
  proof-page-url:
    description: "URL of the uploaded proof page, empty when no dashboard is configured."
    value: ${{ steps.review.outputs.proof-page-url }}
